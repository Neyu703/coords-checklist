name: Deploy Pages

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Static app: serve only the files the page needs (no scripts/, package files or workflows)
      - name: Stage site
        run: |
          mkdir site
          cp index.html app.js style.css base.css data.json sw.js manifest.webmanifest site/
          cp -r icons site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

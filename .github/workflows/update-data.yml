name: Update data

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # The site is deployed from the release branch, so the data lands there
      - uses: actions/checkout@v4
        with:
          ref: release
      - name: Fetch new spots
        run: python3 scripts/update_data.py
      - name: Commit changes
        run: |
          if git diff --quiet data.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update data.json from rally feed"
          git push origin HEAD:release
          # A push with the default token starts no workflow, so trigger the deploy explicitly
          gh workflow run pages.yml --ref release
        env:
          GH_TOKEN: ${{ github.token }}

<html lang="de">
<head>

<meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b6b6b;--line:#e4e4e4;--card:#f6f6f6;--acc:#0a7d4f;--accbg:#e3f4ec;--press:#ececec;--hdr:rgba(255,255,255,.82);color-scheme:light dark;
--sl:max(14px,env(safe-area-inset-left));--sr:max(14px,env(safe-area-inset-right))}
@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--mut:#9a9a9a;--line:#2c2c2c;--card:#202020;--acc:#4cc38a;--accbg:#173326;--press:#2a2a2a;--hdr:rgba(22,22,22,.82)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.35 -apple-system,system-ui,sans-serif;overscroll-behavior-y:none}
header{position:sticky;top:0;background:var(--hdr);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) var(--sr) 10px var(--sl);z-index:5}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
#count{color:var(--mut);font-variant-numeric:tabular-nums;font-size:15px}
.bar{height:5px;background:var(--line);border-radius:3px;margin:8px 0 10px;overflow:hidden}
#fill{height:100%;background:var(--acc);width:0;transition:width .2s}
.ctrl{display:flex;gap:8px}
.ctrl+.ctrl{margin-top:8px}
input[type=search],input[type=text],select{min-height:44px;min-width:0;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;font-size:16px;-webkit-appearance:none;appearance:none}
input[type=search],input[type=text],#fmt{flex:1}
input[type=search]::-webkit-search-decoration{-webkit-appearance:none}
select{padding-right:30px;text-overflow:ellipsis;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:8px;min-height:64px;padding:8px var(--sr) 8px var(--sl);border-bottom:1px solid var(--line);cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;content-visibility:auto;contain-intrinsic-size:auto 64px}
li:active{background:var(--press)}
li.done{background:var(--accbg)}
li.done .nm{text-decoration:line-through;color:var(--mut)}
li.pc .nm::after{content:" ●";color:#e0483e}
input[type=checkbox]{width:26px;height:26px;margin:0;accent-color:var(--acc);flex:none;position:relative}
input[type=checkbox]::before{content:"";position:absolute;inset:-12px -8px -12px -14px}
.tx{flex:1;min-width:0}
.nm{font-weight:500;overflow-wrap:anywhere}
.nm i{font-style:normal;color:var(--mut);font-weight:400;margin-right:6px;font-variant-numeric:tabular-nums}
.co{color:var(--mut);font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.go,button{flex:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:56px;padding:0 10px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;font:inherit;font-size:15px;font-weight:500;text-decoration:none;cursor:pointer;touch-action:manipulation}
a.go:active,button:active{background:var(--press)}
a.go:not([href]){opacity:.4}
button.ok{background:var(--acc);color:#fff;border-color:var(--acc)}
.foot{padding:16px var(--sr) calc(16px + env(safe-area-inset-bottom)) var(--sl);display:flex;gap:8px;justify-content:center}
.empty{padding:30px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<header>

<div class="ctrl">

<input id="cust" type="text" placeholder="z.B. scheme://?c={lat},{lng}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" hidden>
</div>
</header>
<ul id="list"></ul>

const KEY="coords-checked-v1";
let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...done]))}catch(e){}};
const $=id=>document.getElementById(id);
const list=$("list");
const pad=n=>String(n).padStart(3,"0");

async function copy(text){
  try{await navigator.clipboard.writeText(text);return true}catch(e){}
  try{
    const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";
    document.body.appendChild(t);t.select();const ok=document.execCommand("copy");t.remove();return ok;
  }catch(e){return false}
}

DATA.forEach(([n,name,lat,lng])=>{
  const li=document.createElement("li");
  li.dataset.n=n;
  li.dataset.s=(pad(n)+" "+name).toLowerCase();
  if(name.startsWith("Pokémon Center"))li.className="pc";
  li.innerHTML='<input type="checkbox" aria-label="abhaken"><div class="tx"><div class="nm"><i>'+pad(n)+'</i>'+name+'</div><div class="co">'+lat+', '+lng+'</div></div><button>Copy</button><a class="go" target="_blank" rel="noopener">Open</a>';
  const cb=li.querySelector("input"),btn=li.querySelector("button"),go=li.querySelector("a.go");
  go.addEventListener("click",e=>{e.stopPropagation();set(n,true)});
  go.dataset.lat=lat;go.dataset.lng=lng;
  cb.addEventListener("click",e=>{e.stopPropagation();set(n,cb.checked)});
  const doCopy=async e=>{
    e.stopPropagation();
    const ok=await copy(lat+", "+lng);
    if(ok){set(n,true);btn.textContent="✓";btn.classList.add("ok");setTimeout(()=>{btn.textContent="Copy";btn.classList.remove("ok")},900)}
    else{btn.textContent="Fehler";setTimeout(()=>btn.textContent="Copy",900)}
  };
  btn.addEventListener("click",doCopy);
  li.addEventListener("click",doCopy);
  list.appendChild(li);
});

const FK="coords-fmt-v2",CK="coords-cust-v1";
let fmt=$("fmt").value,cust="";
try{const s=localStorage.getItem(FK);if(s&&[...$("fmt").options].some(o=>o.value===s))$("fmt").value=s;cust=localStorage.getItem(CK)||"";$("cust").value=cust}catch(e){}
function url(lat,lng){
  const tpl=$("fmt").value==="custom"?$("cust").value:$("fmt").value;
  return tpl.replace(/\{lat\}/g,lat).replace(/\{lng\}/g,lng);
}
function links(){
  const c=$("fmt").value==="custom";
  $("cust").hidden=!c;
  list.querySelectorAll("a.go").forEach(a=>{
    const u=url(a.dataset.lat,a.dataset.lng);
    if(/^[a-z][a-z0-9+.-]*:\/\//i.test(u))a.href=u;else a.removeAttribute("href");
  });
}
$("fmt").addEventListener("change",()=>{try{localStorage.setItem(FK,$("fmt").value)}catch(e){}links()});
$("cust").addEventListener("input",()=>{try{localStorage.setItem(CK,$("cust").value)}catch(e){}links()});
function set(n,v){
  v?done.add(n):done.delete(n);
  save();render();
}
function render(){
  const q=$("q").value.trim().toLowerCase(),f=$("f").value;
  let shown=0;
  list.querySelectorAll("li").forEach(li=>{
    const n=+li.dataset.n,d=done.has(n);
    li.classList.toggle("done",d);
    li.querySelector("input").checked=d;
    const vis=(!q||li.dataset.s.includes(q))&&(f==="all"||(f==="done")===d);
    li.style.display=vis?"":"none";
    if(vis)shown++;
  });
  $("count").textContent=done.size+" / "+DATA.length;
  $("fill").style.width=(done.size/DATA.length*100)+"%";
  let e=document.getElementById("empty");
  if(!shown&&!e){e=document.createElement("div");e.id="empty";e.className="empty";e.textContent="Nix gefunden.";list.after(e)}
  else if(shown&&e)e.remove();
}
$("q").addEventListener("input",render);
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur()});
$("f").addEventListener("change",render);
let armed=false;
$("reset").addEventListener("click",function(){
  if(!armed){armed=true;this.textContent="Sicher? Nochmal tippen";setTimeout(()=>{armed=false;this.textContent="Alles zurücksetzen"},2500);return}
  done.clear();save();render();armed=false;this.textContent="Alles zurücksetzen";
});
render();links();
</script>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Koordinaten">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Koordinaten-Checkliste</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<div class="top"><h1>Koordinaten</h1><span id="count"></span></div>
<div class="bar"><div id="fill"></div></div>
<div class="ctrl">
<input id="q" type="search" placeholder="Suchen (Name oder Nr.)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
</div>
<div class="ctrl">
<select id="g" aria-label="Rally"><option value="">Alle Rallies</option></select>
<select id="f" aria-label="Status"><option value="all">Alle</option><option value="open">Offen</option><option value="done">Erledigt</option></select>
</div>
</header>
<div id="gbar" class="gbar" hidden><button id="gall"></button></div>
<ul id="list"></ul>
<div class="foot"><button id="exp">Backup kopieren</button><button id="imp">Backup einspielen</button><button id="reset">Alles zurücksetzen</button></div>
<button id="nxt" class="fab">Nächster offener ↓</button>
<script type="module" src="app.js"></script>
</body>
</html>
